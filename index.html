<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dirt Rally — Three.js</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="hud">
      <div class="brand">DIRT RALLY</div>
      <div class="meters">
        <div class="meter">
          <span class="label">SPEED</span>
          <span id="speed">0</span>
          <span class="unit">km/h</span>
        </div>
        <div class="meter">
          <span class="label">TIME</span>
          <span id="time">0:00.00</span>
        </div>
        <div class="meter">
          <span class="label">LAP</span>
          <span id="lap">1 / 3</span>
        </div>
      </div>
      <div id="message" class="message hidden"></div>
      <div class="controls">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows ·
        <kbd>Space</kbd> handbrake · <kbd>R</kbd> reset
      </div>
    </div>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
